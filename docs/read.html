      function __resizeIframe(obj) {
        const scrollbarHeight = 20; // Max between windows, mac, and linux

        function setHeight() {
          // Guard against race condition where iframe isn't ready
          if (!obj.contentWindow?.document?.documentElement) {
            return;
          }
          const element = obj.contentWindow.document.documentElement;
          // If there is no vertical scrollbar, we don't need to resize the iframe
          if (element.scrollHeight === element.clientHeight) {
            return;
          }

          // Create a new height that includes the scrollbar height if it's visible
          const hasHorizontalScrollbar = element.scrollWidth > element.clientWidth;
          const newHeight = element.scrollHeight + (hasHorizontalScrollbar ? scrollbarHeight : 0);

          // Only update the height if it's different from the current height
          if (obj.style.height !== `${newHeight}px`) {
            obj.style.height = `${newHeight}px`;
          }
        }

        // Resize the iframe to the height of the content and bottom scrollbar height
        setHeight();

        // Resize the iframe when the content changes
        const resizeObserver = new ResizeObserver((_entries) => {
          setHeight();
        });
        // Only observe if iframe content is ready
        if (obj.contentWindow?.document?.body) {
          resizeObserver.observe(obj.contentWindow.document.body);
        }
      }
    </script>

            "session": {"cells": [{"code_hash": "2cab78099bd636427406100deebd3495", "console": [], "id": "Hbol", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "9b165af562983bd9f3ff0338a6845b5a", "console": [], "id": "MJUe", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "950ab0254c9de140014c864e9dc1de1c", "console": [], "id": "vblA", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "5c5060bbf3c8552b58120fcef8a091cb", "console": [], "id": "bkHC", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch1 id=\"week-2-applied-machine-learning\"\u003EWeek 2: Applied machine learning\u003C/h1\u003E\n\u003Cspan class=\"paragraph\"\u003EA full week of self-study, mapped to \u003Cstrong\u003EApplied Machine Learning\u003C/strong\u003E. Estimated \u003Cstrong\u003E14 active hours\u003C/strong\u003E, not an official contact-hour claim.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003EIndependent reconstruction, not NUS-issued teaching material.\u003C/strong\u003E Published objectives are the anchor. Exercises, datasets and rubric are original.\u003C/span\u003E\n\u003Cul\u003E\n\u003Cli\u003EBuild regression and classification baselines\u003C/li\u003E\n\u003Cli\u003ESeparate training, validation and final testing\u003C/li\u003E\n\u003Cli\u003EMeasure precision, recall, error and threshold tradeoffs\u003C/li\u003E\n\u003C/ul\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Ca href=\"https://www.comp.nus.edu.sg/executive-education/course/sctp-applied-machine-learning/\" rel=\"noopener noreferrer\" target=\"_blank\"\u003EOfficial objectives\u003C/a\u003E | \u003Ca href=\"https://github.com/azjhf-dev/nus-aie-week-02-machine-learning\" rel=\"noopener noreferrer\" target=\"_blank\"\u003ERepository\u003C/a\u003E\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003EBoundary:\u003C/strong\u003E Student metrics are not treated as independently reproduced. The core uses transparent NumPy implementations; scikit-learn comparison is an extension.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "8d5af8da5c5a32d6b983cbb0b31be2e0", "console": [], "id": "lEQa", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"plan-your-week\"\u003EPlan your week\u003C/h2\u003E\n\u003Cul\u003E\n\u003Cli\u003EDay 1: problem framing and split strategy (2h)\u003C/li\u003E\n\u003Cli\u003EDay 2: regression and gradient descent (3h)\u003C/li\u003E\n\u003Cli\u003EDay 3: logistic classification and thresholds (3h)\u003C/li\u003E\n\u003Cli\u003EDay 4: complexity, validation and leakage (2h)\u003C/li\u003E\n\u003Cli\u003EDay 5: error analysis and model card (4h)\u003C/li\u003E\n\u003C/ul\u003E\n\u003Cspan class=\"paragraph\"\u003EStart each lab by predicting the effect of a control. Change one variable, record the observation, then explain why. All default experiments need no key, no paid service and no private data. The hosted WASM viewer needs an internet connection to fetch its runtime and packages.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "e7dcf544d6e13bfb4f59f9c13e86467e", "console": [], "id": "PKri", "outputs": [{"data": {"text/html": "\u003Cmarimo-ui-element object-id='PKri-0' random-id='2d39c103-0fc1-1603-0ee9-5c485621e8a9'\u003E\u003Cmarimo-checkbox data-initial-value='true' data-label='\u0026quot;\u0026#92;u003cspan class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026#92;u003e\u0026#92;u003cspan class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026#92;u003ePlay conceptual motion graphic\u0026#92;u003c/span\u0026#92;u003e\u0026#92;u003c/span\u0026#92;u003e\u0026quot;' data-disabled='false'\u003E\u003C/marimo-checkbox\u003E\u003C/marimo-ui-element\u003E"}, "type": "data"}]}, {"code_hash": "c97d089f2059e96b0dcaf165f350e3e5", ph\u0026#92;\u0026quot;\u0026#92;u003eInference feature offset\u0026#92;u003c/span\u0026#92;u003e\u0026#92;u003c/span\u0026#92;u003e\u0026quot;' data-start='-2' data-stop='2' data-step='0.1' data-steps='[]' data-debounce='false' data-disabled='false' data-orientation='\u0026quot;horizontal\u0026quot;' data-show-value='false' data-include-input='false' data-full-width='false'\u003E\u003C/marimo-slider\u003E\u003C/marimo-ui-element\u003E"}, "type": "data"}]}, {"code_hash": "818df388e6fab728beefdde1d51bd2b0", "console": [], "id": "TqIu", "outputs": [{"data": {"text/html": "\u003Csection style=\"margin:12px 0;padding:14px;background:#f6f8f6;border-radius:12px\"\u003E\u003Cp style=\"font:600 15px/1.4 system-ui;margin:0 0 10px;color:#20332e\"\u003EAccuracy under controlled feature corruption\u003C/p\u003E\u003Csvg role=\"img\" aria-label=\"Accuracy under controlled feature corruption\" viewBox=\"0 0 400 100\" style=\"width:100%;height:auto\"\u003E\u003Ctitle\u003EAccuracy under controlled feature corruption\u003C/title\u003E\u003Ctext x=\"0\" y=\"22\" font-size=\"14\" fill=\"#20332e\"\u003Eclean validation\u003C/text\u003E\u003Crect x=\"132\" y=\"4\" width=\"210.00\" height=\"25\" rx=\"4\" fill=\"#12675c\"/\u003E\u003Ctext x=\"347.00\" y=\"22\" font-size=\"14\" fill=\"#20332e\"\u003E0.833\u003C/text\u003E\u003Ctext x=\"0\" y=\"66\" font-size=\"14\" fill=\"#20332e\"\u003Eshifted features\u003C/text\u003E\u003Crect x=\"132\" y=\"48\" width=\"210.00\" height=\"25\" rx=\"4\" fill=\"#b56420\"/\u003E\u003Ctext x=\"347.00\" y=\"66\" font-size=\"14\" fill=\"#20332e\"\u003E0.833\u003C/text\u003E\u003C/svg\u003E\u003C/section\u003E"}, "type": "data"}]}, {"code_hash": "e4291990476f961b17a752d78ffa894a", "console": [], "id": "Vxnm", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"build-something-then-defend-it\"\u003EBuild something, then defend it\u003C/h2\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003EThis week's deliverable:\u003C/strong\u003E A held-out synthetic intervention classifier with a model card.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003ECreate a dated lab log with: question, prediction, changed input, observed output, explanation, failure case and next test. Keep the final evaluation separate from the data used for choosing settings.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "f7a8fdb938407e1c2c07ae3321bc7e82", "console": [], "id": "DnEU", "outputs": [{"data": {"text/html": "\u003Cmarimo-accordion data-labels='[\u0026quot;\u0026#92;u003cspan class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026#92;u003e\u0026#92;u003cspan class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026#92;u003eWhy is the threshold exploration set not a final test?\u0026#92;u003c/span\u0026#92;u003e\u0026#92;u003c/span\u0026#92;u003e\u0026quot;,\u0026quot;\u0026#92;u003cspan class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026#92;u003e\u0026#92;u003cspan class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026#92;u003eDoes high recall imply high precision?\u0026#92;u003c/span\u0026#92;u003e\u0026#92;u003c/span\u0026#92;u003e\u0026quot;,\u0026quot;\u0026#92;u003cspan class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026#92;u003e\u0026#92;u003cspan class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026#92;u003eBuild task\u0026#92;u003c/span\u0026#92;u003e\u0026#92;u003c/span\u0026#92;u003e\u0026quot;]' data-multiple='false' data-expanded='[]'\u003E\u003Cdiv\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003EThe threshold was selected using those outcomes. Lock a separate set before choosing it.\u003C/span\u003E\u003C/span\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003ENo. Lowering the threshold may find more positives while creating more false alarms.\u003C/span\u003E\u003C/span\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003EImplement k-fold cross-validation without sharing preprocessing statistics; compare logistic regression with a majority baseline and lock a final test.\u003C/span\u003E\u003C/span\u003E\u003C/div\u003E\u003C/marimo-accordion\u003E"}, "type": "data"}]}, {"code_hash": "ebd2c5fd83c79244d4659f6a10e55f30", "console": [], "id": "ulZA", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"evidence-and-next-depth\"\u003EEvidence and next depth\u003C/h2\u003E\n\u003Cspan class=\"paragraph\"\u003EThese are \u003Cstrong\u003Eother NUS-ISS courses and projects\u003C/strong\u003E, not submissions from this exact SCTP programme. A public repository does not establish permission to copy everything in it. The research CSV records license and evidence depth.\u003C/span\u003E\n\u003Cul\u003E\n\u003Cli\u003E\u003Ccode\u003EISS-IS02PT/PRS-PM-ISY5002-GROUP5\u003C/code\u003E\u003C/li\u003E\n\u003Cli\u003E\u003Ccode\u003Ebhuiyanmobasshir94/NUS-Artificial-Intelligence-Training\u003C/code\u003E\u003C/li\u003E\n\u003Cli\u003E\u003Ccode\u003EIRS-PM/IRS-PM-2021-01-16-IS03PT-GRP-HDB-Resale-Price-Recommender\u003C/code\u003E\u003C/li\u003E\n\u003C/ul\u003E\n\u003Cspan class=\"paragraph\"\u003ESee \u003Ccode\u003ECURRICULUM.md\u003C/code\u003E, \u003Ccode\u003EASSESSMENT.md\u003C/code\u003E, \u003Ccode\u003ESOURCES.md\u003C/code\u003E and the portfolio files for more work. Real pretrained model training and live-service integrations are optional extensions, not things this notebook silently performs.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EChecked 19 November 2026. Record your own results; published student results are not reproduced he
